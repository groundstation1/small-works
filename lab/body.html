<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>lab · body</title>
<style>
  body { margin: 0; background: #222; color: #777; font: 11px/1.3 ui-monospace, monospace; padding: 6px; }
  .strip { margin-bottom: 6px; } .strip canvas { width: 100%; display: block; cursor: pointer; }
  body.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
</style></head><body>
<script>
  // A jointed body under gravity, driven only by rhythmic muscles, recorded like Marey's plates:
  // limbs as white lines on black, sampled at a fixed interval.   ?base=1 · ?chain=4 · ?one=4.2
  function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const pick = (R, a) => a[Math.floor(R() * a.length)], range = (R, a, b) => a + (b - a) * R();

  // joints: 0 head, 1 neck, 2 pelvis, 3 kneeL, 4 footL, 5 kneeR, 6 footR, 7 elbowL, 8 handL, 9 elbowR, 10 handR
  const REST = [[0, 1.74], [0, 1.47], [0, 0.93], [0.03, 0.48], [0.03, 0.03], [-0.03, 0.48], [-0.03, 0.03], [0.02, 1.17], [0.04, 0.9], [-0.02, 1.17], [-0.04, 0.9], [0.01, 1.2]];
  const BONES = [[0, 1], [1, 11], [11, 2], [2, 3], [3, 4], [2, 5], [5, 6], [1, 7], [7, 8], [1, 9], [9, 10]];   // 11 = mid-spine: the back bends
  // muscles: [pivot, parentFrom, child] — angle of (pivot→child) measured against (parentFrom→pivot)
  const MUSCLES = { neck: [1, 11, 0], spine: [11, 2, 1], hipL: [2, 11, 3], kneeL: [3, 2, 4], hipR: [2, 11, 5], kneeR: [5, 2, 6], shL: [1, 11, 7], elL: [7, 1, 8], shR: [1, 11, 9], elR: [9, 1, 10] };
  // relative angles at rest: head and back continue the line of the body (0); arms hang down from the shoulders (π)
  const REST_ANGLE = { neck: 0, spine: 0, hipL: 0, kneeL: 0, hipR: 0, kneeR: 0, shL: Math.PI, elL: 0, shR: Math.PI, elR: 0 };

  // v2: a body's coordination (hips opposed, knees a quarter-cycle behind and only bending back, arms against legs);
  // speed, strength, lean and asymmetry left to chance
  function gaitProgram(seed) {
    const R = rng(seed * 40503 + 43);
    const f = range(R, 0.6, 2.2), hip = range(R, 0.2, 1.0), knee = range(R, 0.1, 1.2), arm = range(R, 0, 1.1), asym = range(R, 0, 0.35);
    const m = {
      neck: { base: range(R, -0.3, 0.3), amp: range(R, 0, 0.15), f, ph: 0 },
      spine: { base: range(R, -0.25, 0.35), amp: range(R, 0, 0.25), f: f * 2, ph: range(R, 0, 6.283) },
      hipL: { base: range(R, -0.2, 0.3), amp: hip, f, ph: 0 },
      hipR: { base: range(R, -0.2, 0.3), amp: hip * (1 - asym), f, ph: Math.PI + range(R, -asym, asym) },
      kneeL: { base: -knee, amp: knee * 0.9, f, ph: -1.57 },
      kneeR: { base: -knee, amp: knee * 0.9 * (1 - asym), f, ph: Math.PI - 1.57 },
      shL: { base: range(R, -0.3, 0.3), amp: arm, f, ph: Math.PI }, shR: { base: range(R, -0.3, 0.3), amp: arm, f, ph: 0 },
      elL: { base: range(R, 0, 1.2), amp: range(R, 0, 0.5), f, ph: 0 }, elR: { base: range(R, 0, 1.2), amp: range(R, 0, 0.5), f, ph: Math.PI },
    };
    return { m, balance: range(R, 0, 0.9), stiff: range(R, 0.15, 0.45), push: range(R, 0.3, 0.9), mu: range(R, 0.6, 0.97), vx: range(R, 0.3, 1.8),
             lean: range(R, -0.05, 0.3), T: range(R, 4, 9), every: pick(R, [1 / 8, 1 / 10, 1 / 12, 1 / 16]), seed };
  }
  function program(seed) {
    if (new URLSearchParams(location.search).get('v') === '2') return gaitProgram(seed);
    const R = rng(seed * 2654435761 + 41);
    const f = range(R, 0.3, 2.4), gait = R() < 0.6;
    const m = {};
    for (const k of Object.keys(MUSCLES)) {
      const side = k.endsWith('R') ? 1 : 0;
      m[k] = { base: range(R, -0.5, 0.5), amp: range(R, 0, k === 'neck' ? 0.4 : 1.3),
               f: gait ? f : range(R, 0.3, 2.4), ph: gait ? (side ? Math.PI : 0) + range(R, -0.3, 0.3) : range(R, 0, 6.283) };
    }
    return { m, stiff: range(R, 0.04, 0.35), push: range(R, 0.2, 0.9), mu: range(R, 0.4, 0.97), vx: range(R, 0, 1.6),
             lean: range(R, -0.25, 0.25), T: range(R, 4, 10), every: pick(R, [1 / 10, 1 / 16, 1 / 25, 1 / 40]), seed };
  }
  function mutate(p0, m) {
    const R = rng(m * 7919 + 3), p = JSON.parse(JSON.stringify(p0)), w = R(), keys = Object.keys(p.m);
    if (w < 0.3) { const k = pick(R, keys); p.m[k].amp = range(R, 0, 1.4); }
    else if (w < 0.45) { const k = pick(R, keys); p.m[k].base = range(R, -0.8, 0.8); }
    else if (w < 0.6) { const f = range(R, 0.3, 2.4); for (const k of keys) p.m[k].f = f; }
    else if (w < 0.7) p.stiff = range(R, 0.04, 0.4);
    else if (w < 0.8) p.every = pick(R, [1 / 8, 1 / 12, 1 / 20, 1 / 30, 1 / 50]);
    else if (w < 0.9) p.vx = range(R, 0, 2);
    else p.mu = range(R, 0.3, 0.98);
    return p;
  }
  const fromChain = c => { const [s, ...ms] = String(c).split('.').map(Number); return ms.reduce(mutate, program(s)); };

  const ang = (x, y) => Math.atan2(y, x), wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  function simulate(p, onSample) {
    const P = REST.map(([x, y]) => [x + 0.8, y + 0.02]), O = P.map(([x, y]) => [x - p.vx / 240, y]);
    const L = BONES.map(([a, b]) => Math.hypot(REST[a][0] - REST[b][0], REST[a][1] - REST[b][1]));
    // lean the whole body a little to begin with
    for (const q of [P, O]) for (const pt of q) { const dx = pt[0] - 0.8, dy = pt[1]; pt[0] = 0.8 + dx * Math.cos(p.lean) + dy * Math.sin(p.lean); pt[1] = -dx * Math.sin(p.lean) + dy * Math.cos(p.lean) + 0.02; }
    const dt = 1 / 240, steps = Math.floor(p.T / dt), every = Math.max(1, Math.round(p.every / dt));
    for (let s = 0; s < steps; s++) {
      const t = s * dt;
      for (let i = 0; i < P.length; i++) {                              // Verlet with gravity
        const [x, y] = P[i], [ox, oy] = O[i]; O[i] = [x, y];
        let vx = (x - ox) * 0.996, vy = (y - oy) * 0.996; const sp = Math.hypot(vx, vy), cap = 6 * dt;   // no faster than 6 m/s
        if (sp > cap) { vx *= cap / sp; vy *= cap / sp; }
        P[i] = [x + vx, y + vy - 9.81 * dt * dt];
      }
      if (p.balance) {                                                  // a posture reflex: the torso tries to stand up straight
        const tilt = ang(P[1][0] - P[2][0], P[1][1] - P[2][1]) - Math.PI / 2, e = -wrap(tilt) * p.balance * 0.02;
        const rot = (pt, c, a) => { const dx = pt[0] - c[0], dy = pt[1] - c[1]; return [c[0] + dx * Math.cos(a) - dy * Math.sin(a), c[1] + dx * Math.sin(a) + dy * Math.cos(a)]; };
        for (const i of [0, 1, 7, 8, 9, 10, 11]) P[i] = rot(P[i], P[2], e * (i === 11 ? 0.5 : 1));
        // and the legs push back against it, so the ground has to take the reaction
        for (const i of [3, 4, 5, 6]) P[i] = rot(P[i], P[2], -e * 0.6);
      }
      for (const [k, [piv, par, ch]] of Object.entries(MUSCLES)) {      // muscles, once a step: turn the child towards the rhythm's angle
        const mu = p.m[k], target = REST_ANGLE[k] + mu.base + mu.amp * Math.sin(6.283 * mu.f * t + mu.ph);
        const a0 = ang(P[piv][0] - P[par][0], P[piv][1] - P[par][1]), a1 = ang(P[ch][0] - P[piv][0], P[ch][1] - P[piv][1]);
        const err = wrap(a0 + target - a1) * p.stiff * 0.12;
        const rot = (pt, c, a) => { const dx = pt[0] - c[0], dy = pt[1] - c[1]; return [c[0] + dx * Math.cos(a) - dy * Math.sin(a), c[1] + dx * Math.sin(a) + dy * Math.cos(a)]; };
        const nc = rot(P[ch], P[piv], err), np = rot(P[par], P[piv], -err * p.push);
        // internal forces can't move the body's centre: balance the move so momentum comes only from the ground
        const sx = -((nc[0] - P[ch][0]) + (np[0] - P[par][0])) / 3, sy = -((nc[1] - P[ch][1]) + (np[1] - P[par][1])) / 3;
        P[ch] = [nc[0] + sx, nc[1] + sy]; P[par] = [np[0] + sx, np[1] + sy]; P[piv] = [P[piv][0] + sx, P[piv][1] + sy];
      }
      for (let it = 0; it < 16; it++) {
        BONES.forEach(([a, b], i) => {                                   // bones keep their length
          const dx = P[b][0] - P[a][0], dy = P[b][1] - P[a][1], d = Math.hypot(dx, dy) || 1e-6, k = (d - L[i]) / d * 0.5;
          P[a] = [P[a][0] + dx * k, P[a][1] + dy * k]; P[b] = [P[b][0] - dx * k, P[b][1] - dy * k];
        });
        for (let i = 0; i < P.length; i++) if (P[i][1] < 0) {           // the ground: it stops you, and it holds
          P[i][1] = 0; P[i][0] = O[i][0] + (P[i][0] - O[i][0]) * (1 - p.mu);
        }
      }
      if (onSample.every ? s % onSample.every === 0 : onSample.everyStep ? s % 2 === 0 : s % every === 0) onSample(P, t);
    }
  }

  function plate(p, W, H, canvas, span = 7) {
    canvas.width = W; canvas.height = H;
    const c = canvas.getContext('2d'), k = W / span;
    c.fillStyle = '#0b0b0b'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(236, 232, 222, 0.62)'; c.lineWidth = Math.max(1, W / 900); c.lineCap = 'round';
    simulate(p, P => {
      c.beginPath();
      for (const [a, b] of BONES) { c.moveTo(P[a][0] * k, H - 0.12 * k - P[a][1] * k); c.lineTo(P[b][0] * k, H - 0.12 * k - P[b][1] * k); }
      c.stroke();
    });
  }

  // traces, after Trisha Brown: the body is never shown; hands, feet and head carry charcoal
  const ENDS = [8, 10, 4, 6, 0];
  function traces(p, W, H, canvas, span = 7) {
    canvas.width = W; canvas.height = H;
    const c = canvas.getContext('2d'), k = W / span;
    c.fillStyle = '#efece5'; c.fillRect(0, 0, W, H);
    c.lineCap = 'round'; c.lineJoin = 'round';
    let last = null;
    const on = (P) => {
      const pts = ENDS.map(i => [P[i][0] * k, H - 0.12 * k - P[i][1] * k]);
      if (last) pts.forEach(([x, y], j) => {
        const [lx, ly] = last[j], sp = Math.hypot(x - lx, y - ly);
        c.strokeStyle = `rgba(22, 20, 18, ${Math.min(0.85, 0.25 + sp * 0.12)})`;   // fast strokes press harder
        c.lineWidth = Math.max(0.7, W / 1400) * (j === 4 ? 0.6 : 1);
        c.beginPath(); c.moveTo(lx, ly); c.lineTo(x, y); c.stroke();
      });
      last = pts;
    };
    on.everyStep = true;
    simulate(p, on);
  }

  // long exposure: the body as soft pale volume, accumulated with the shutter open.
  // Where it stays it burns in; where it moves it's a ghost.
  const THICK = [0.2, 0.32, 0.27, 0.16, 0.12, 0.16, 0.12, 0.1, 0.08, 0.1, 0.08];   // head-neck, chest, belly, thigh, shin, ..., upper arm, forearm (m)
  function exposure(p, W, H, canvas, span = 7) {
    canvas.width = W; canvas.height = H;
    const c = canvas.getContext('2d'), k = W / span;
    c.fillStyle = '#070707'; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    const a = (q.has('gain') ? +q.get('gain') : 1.6) / 255;             // each sample adds about one level of light: stillness burns in slowly
    // a shutter is continuous: sample every physics step. Each instant is the whole body as one opaque silhouette
    // (no double light at joints); eight instants sum into a sub-frame, sub-frames add to the plate at low strength.
    // Two stages, so an 8-bit canvas can still hold hundreds of faint instants.
    const f = document.createElement('canvas'); f.width = W; f.height = H;
    const fc = f.getContext('2d'); fc.lineCap = 'round'; fc.strokeStyle = fc.fillStyle = 'rgb(238, 226, 208)';
    const r = document.createElement('canvas'); r.width = W; r.height = H; const rc = r.getContext('2d');
    const RIM = +q.get('rim') || 0.05, FILL = q.has('fill') ? +q.get('fill') : 0.22;   // rim width in metres; shadow side brightness
    const sub = document.createElement('canvas'); sub.width = W; sub.height = H;
    const sc = sub.getContext('2d'); sc.globalCompositeOperation = 'lighter';
    let n = 0;
    const on = (P) => {
      fc.clearRect(0, 0, W, H);
      if (q.get('shape') === 'capsule') {
        BONES.forEach(([i, j], b) => {
          fc.lineWidth = THICK[b] * k;
          fc.beginPath(); fc.moveTo(P[i][0] * k, H - 0.12 * k - P[i][1] * k); fc.lineTo(P[j][0] * k, H - 0.12 * k - P[j][1] * k); fc.stroke();
        });
        fc.beginPath(); fc.arc(P[0][0] * k, H - 0.12 * k - P[0][1] * k, 0.12 * k, 0, 7); fc.fill();
      } else drawHuman(fc, P, k, H);
      // side light from the upper left: the rim is the silhouette minus itself shifted away from the light
      rc.globalCompositeOperation = 'copy'; rc.drawImage(f, 0, 0);
      rc.globalCompositeOperation = 'destination-out'; rc.drawImage(f, RIM * k * 0.8, RIM * k * 0.6);
      sc.globalAlpha = FILL / 8; sc.drawImage(f, 0, 0);                  // the body itself, mostly in shadow
      sc.globalAlpha = 1 / 8; sc.drawImage(r, 0, 0);                     // its lit edge
      if (++n % 8 === 0) { c.globalAlpha = a * 255 / 238; c.drawImage(sub, 0, 0); c.globalAlpha = 1; sc.clearRect(0, 0, W, H); }
    };
    on.every = 1;
    simulate(p, on);
    c.globalCompositeOperation = 'source-over';
  }

  // ---------- a human shape on the bones ----------
  // Each segment carries a profile [u along the bone 0..1, back width, front width] in metres. Bones run downward
  // at rest, so the perpendicular (-dy, dx) points to the body's front (the direction of travel).
  const PROFILE = {
    chest: [[0, 0.055, 0.05], [0.12, 0.11, 0.08], [0.45, 0.125, 0.135], [0.8, 0.11, 0.12], [1, 0.105, 0.11]],
    belly: [[0, 0.105, 0.11], [0.4, 0.11, 0.12], [0.75, 0.14, 0.115], [0.92, 0.15, 0.1], [1, 0.12, 0.085]],
    thigh: [[0, 0.085, 0.085], [0.15, 0.085, 0.095], [0.55, 0.07, 0.075], [0.92, 0.05, 0.055], [1, 0.05, 0.05]],
    shin: [[0, 0.05, 0.05], [0.25, 0.065, 0.045], [0.55, 0.05, 0.04], [0.9, 0.03, 0.032], [1, 0.03, 0.03]],
    upper: [[0, 0.05, 0.052], [0.25, 0.042, 0.05], [0.7, 0.036, 0.04], [1, 0.033, 0.034]],
    fore: [[0, 0.036, 0.038], [0.3, 0.04, 0.036], [0.8, 0.026, 0.026], [1, 0.022, 0.022]],
  };
  const HEAD = [[0, -0.05], [0.05, -0.06], [0.13, -0.1], [0.21, -0.095], [0.265, -0.04], [0.27, 0.02], [0.245, 0.07],
                [0.2, 0.09], [0.17, 0.092], [0.15, 0.117], [0.132, 0.1], [0.115, 0.098], [0.1, 0.1], [0.085, 0.092],
                [0.07, 0.082], [0.058, 0.035], [0.03, 0.045], [0, 0.048]];      // (along from neck to head, towards the face)
  const FOOT = [[-0.055, -0.03], [-0.065, 0.02], [-0.045, 0.06], [0.06, 0.07], [0.19, 0.068], [0.215, 0.055],
                [0.2, 0.035], [0.1, 0.005], [0.03, -0.035]];                   // (along the foot, towards the sole)
  function drawHuman(g, P, k, H) {
    const X = ([x, y]) => [x * k, H - 0.12 * k - y * k];
    const frame = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1e-6; return { a, L, d: [dx / L, dy / L], n: [-dy / L, dx / L] }; };
    const at = (F, u, v) => X([F.a[0] + F.d[0] * u + F.n[0] * v, F.a[1] + F.d[1] * u + F.n[1] * v]);
    const smooth = pts => {                                             // a closed curve through the midpoints: no corners
      g.beginPath();
      const m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
      let s = m(pts[pts.length - 1], pts[0]); g.moveTo(s[0], s[1]);
      for (let i = 0; i < pts.length; i++) { const e = m(pts[i], pts[(i + 1) % pts.length]); g.quadraticCurveTo(pts[i][0], pts[i][1], e[0], e[1]); }
      g.closePath(); g.fill();
    };
    const limb = (a, b, prof) => {                                      // a, b: joint indices or points
      const F = frame(Array.isArray(a) ? a : P[a], Array.isArray(b) ? b : P[b]), back = prof.map(([u, w]) => at(F, u * F.L, -w)), front = prof.map(([u, , w]) => at(F, u * F.L, w)).reverse();
      smooth([...back, ...front]);
    };
    limb(1, 11, PROFILE.chest); limb(11, 2, PROFILE.belly);
    for (const [hip, knee, foot] of [[2, 3, 4], [2, 5, 6]]) {
      limb(hip, knee, PROFILE.thigh); limb(knee, foot, PROFILE.shin);
      // the foot: at right angles to the shin, pointing forwards; flat once it is on the floor
      const S = frame(P[knee], P[foot]); let dir = [S.n[0], S.n[1]];
      if (P[foot][1] < 0.06) { const w = 1 - P[foot][1] / 0.06; dir = [dir[0] * (1 - w) + w * Math.sign(S.n[0] || 1), dir[1] * (1 - w)]; }
      const dl = Math.hypot(dir[0], dir[1]) || 1, Fd = { a: P[foot], d: [dir[0] / dl, dir[1] / dl], n: [0, 0] };
      Fd.n = [Fd.d[1] * Math.sign(S.n[0] || 1), -Fd.d[0] * Math.sign(S.n[0] || 1)];       // towards the sole
      smooth(FOOT.map(([u, v]) => at(Fd, u, v)));
    }
    for (const [sh, el, hand] of [[1, 7, 8], [1, 9, 10]]) {
      const shoulder = [P[sh][0] * 0.8 + P[11][0] * 0.2, P[sh][1] * 0.8 + P[11][1] * 0.2];   // the arm hangs from just below the neck
      limb(shoulder, el, PROFILE.upper); limb(el, hand, PROFILE.fore);
      // the hand: palm on from the wrist, four fingers and a thumb, a little curled
      const F = frame(P[el], P[hand]);
      const palm = [[0, -0.022], [0.09, -0.03], [0.1, 0.03], [0.02, 0.026]].map(([u, v]) => at({ ...F, a: P[hand] }, u, v));
      smooth(palm);
      g.lineCap = 'round';
      [-0.022, -0.008, 0.007, 0.021].forEach((v, i) => {
        const len = [0.075, 0.085, 0.08, 0.065][i], Fh = { ...F, a: P[hand] };
        const p0 = at(Fh, 0.09, v), p1 = at(Fh, 0.09 + len * 0.6, v * 1.1 + 0.006), p2 = at(Fh, 0.09 + len, v * 1.15 + 0.018);
        g.lineWidth = 0.017 * k; g.beginPath(); g.moveTo(p0[0], p0[1]); g.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); g.stroke();
      });
      const Fh = { ...F, a: P[hand] }, t0 = at(Fh, 0.015, 0.025), t1 = at(Fh, 0.05, 0.05), t2 = at(Fh, 0.085, 0.052);
      g.lineWidth = 0.02 * k; g.beginPath(); g.moveTo(t0[0], t0[1]); g.quadraticCurveTo(t1[0], t1[1], t2[0], t2[1]); g.stroke();
    }
    // neck and head, facing the way the body faces
    const Fn = frame(P[1], P[0]); Fn.n = [Fn.d[1], -Fn.d[0]];              // head frame: along = up the neck, n = towards the face
    smooth(HEAD.map(([u, v]) => at(Fn, u, v)));
  }
  // poses: sharp single silhouettes at intervals, to check the shape itself
  function poses(p, W, H, canvas, span = 7) {
    canvas.width = W; canvas.height = H;
    const c = canvas.getContext('2d'), k = W / span; c.fillStyle = '#0b0b0b'; c.fillRect(0, 0, W, H);
    c.fillStyle = c.strokeStyle = 'rgba(238, 226, 208, 0.55)';
    let n = 0; const on = P => { if (n++ % 60 === 0) drawHuman(c, P, k, H); }; on.every = 1; simulate(p, on);
  }

  const q = new URLSearchParams(location.search);
  if (q.has('cols')) document.body.classList.add('cols');
  const list = q.get('list') && q.get('list').split(','), chain = q.get('chain'), b = +q.get('base') || 1;
  const names = q.has('one') ? [q.get('one')] : list || Array.from({ length: +q.get('n') || 12 }, (_, k) => chain ? chain + '.' + (k + 1) : String(b + k));
  for (const name of names) {
    const p = fromChain(name), div = document.createElement('div'), c = document.createElement('canvas');
